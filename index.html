<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScanLote AI - Recebimento e Inventário Inteligente</title>
    <meta name="description" content="Sistema web inteligente para recebimento, identificação, organização, registro e rastreamento de produtos por fotografia com IA Gemini, controle de lotes, caixas congeladas e deduplicação." />
    <meta property="og:title" content="ScanLote AI - Recebimento e Inventário Inteligente" />
    <meta property="og:description" content="Sistema web inteligente para recebimento, identificação, organização, registro e rastreamento de produtos por fotografia com IA Gemini, controle de lotes, caixas congeladas e deduplicação." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        function isFirebasePopupAssertion(str) {
          if (!str) return false;
          var s = String(str);
          return (
            s.indexOf("Pending promise was never set") !== -1 ||
            s.indexOf("INTERNAL ASSERTION FAILED") !== -1 ||
            s.indexOf("auth/popup-closed-by-user") !== -1 ||
            s.indexOf("auth/cancelled-popup-request") !== -1
          );
        }

        // Intercepta rejeições não tratadas do Firebase Auth
        window.addEventListener("unhandledrejection", function(event) {
          var reason = event && (event.reason || event);
          var msg = (reason && (reason.message || reason.stack || reason.code || reason)) || "";
          if (isFirebasePopupAssertion(msg)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === "function") event.stopImmediatePropagation();
            if (typeof event.stopPropagation === "function") event.stopPropagation();
            console.warn("[GoogleAuth] Suprimida rejeição assíncrona transitória do pop-up Firebase:", msg);
          }
        }, true);

        // Intercepta erros globais da janela
        window.addEventListener("error", function(event) {
          var msg = (event && (event.message || (event.error && (event.error.message || event.error.stack)))) || "";
          if (isFirebasePopupAssertion(msg)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === "function") event.stopImmediatePropagation();
            if (typeof event.stopPropagation === "function") event.stopPropagation();
            console.warn("[GoogleAuth] Suprimido erro transitório de pop-up fechado do Firebase:", msg);
          }
        }, true);

        // Intercepta console.error do logger interno do Firebase Auth para asserções de popup
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) {
            try { return typeof a === "object" ? JSON.stringify(a) : String(a); } catch(e) { return String(a); }
          }).join(" ");
          if (isFirebasePopupAssertion(joined)) {
            console.warn.apply(console, ["[GoogleAuth] (Aviso tratado de autenticação):"].concat(args));
            return;
          }
          return origConsoleError.apply(console, arguments);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
